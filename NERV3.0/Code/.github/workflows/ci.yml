name: NERV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly long-tail gates (fuzz + full lib sweep) — Session 12 D1/D2.
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # The determinism matrix (DSR-11): the same chain on three architectures.
  determinism:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p nerv-state
      - run: cargo test --target ${{ matrix.target }} -p nerv-state

  # The firewall test (DSR-1 / Axiom 3).
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The manifest-graph check
        run: cargo test -p nerv-knowledge the_firewall_is_a_build_rule -- --nocapture
      - name: The delete test (full workspace build without nerv-knowledge)
        run: cargo test -p nerv-knowledge --release -- --ignored the_workspace_builds_without_nerv_knowledge --nocapture

  # The conformance suite.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full conformance run
        run: cargo test -p nerv-conformance

  # The testkit (T5–T7 schedule corpus).
  testkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The TLA+ schedule corpus
        run: cargo test -p nerv-testkit

  # Unit tests across all crates (Linux).
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: All tests
        run: cargo test --workspace

  # Unit tests (macOS: the native GUI).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p nerv-core -p nerv-crypto -p nerv-custody -p nerv-seal -p nerv-state -p nerv-economy

  # Unit tests (Windows).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p nerv-core -p nerv-crypto -p nerv-custody -p nerv-seal -p nerv-state -p nerv-economy

  # The WASM wallet build.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack
      - name: Build the WASM wallet
        run: |
          cd apps/nerv-gui
          wasm-pack build --target web --release --out-dir pkg

  # Fuzz targets (scheduled, not per-PR).
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: Run fuzz targets
        run: |
          cd fuzz
          cargo fuzz run codec -- -max_total_time=60
          cargo fuzz run sphinx_peel -- -max_total_time=60
          cargo fuzz run seal_digitize -- -max_total_time=60
          cargo fuzz run ring_ntt -- -max_total_time=60

  # Release builds (on tags).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, determinism, firewall, conformance]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nerv-node-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nerv-node-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nerv-node-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin nerv-node --bin nerv-relay --bin nerv-aggregator --bin nerv-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/nerv-node*

  # === D1: testnet CI gates (Session 12) ===

  # Per-crate strict clippy: the canonical "tree is clippy-clean" gate.
  # Runs on Windows (pwsh) and Linux (sh).
  strict-clippy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Strict clippy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/scripts/ci-strict-clippy.sh
      - name: Strict clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tests/scripts/ci-strict-clippy.ps1

  # Quick regression gate: the 7 Session-9-cleaned crates' lib suites.
  test-quick:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Quick regression gate (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/scripts/ci-test-quick.sh
      - name: Quick regression gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tests/scripts/ci-test-quick.ps1

  # Full lib sweep: chunked per crate to fit the 8 GB box. Nightly only.
  lib-sweep:
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full lib sweep (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/scripts/ci-lib-sweep.sh
      - name: Full lib sweep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tests/scripts/ci-lib-sweep.ps1

  # D4 criterion benches: nightly regression check. Baseline numbers were
  # captured on a 16-GB Windows box (Session 13); 5%-over-baseline
  # regression on any of the 5 production hot paths is the failure gate.
  bench:
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all benches (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --benches --ignore-rust-version \
            -p nerv-seal -p nerv-codec -p nerv-net \
            -p nerv-proofs -p nerv-state --features nerv-state/testkit
      - name: Build all benches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --benches --ignore-rust-version `
            -p nerv-seal -p nerv-codec -p nerv-net `
            -p nerv-proofs -p nerv-state --features nerv-state/testkit
      - name: Run D4 benches
        shell: bash
        run: |
          for B in ring_ntt build_leg_features sphinx witness_gen apply_block; do
            case "$B" in
              ring_ntt)            P=nerv-seal  ;;
              build_leg_features)  P=nerv-codec ;;
              sphinx)              P=nerv-net   ;;
              witness_gen)         P=nerv-proofs ;;
              apply_block)         P=nerv-state  FEAT=--features testkit ;;
            esac
            FEAT_ARG="${FEAT:-}"
            cargo bench --ignore-rust-version --offline -p "$P" --bench "$B" $FEAT_ARG \
              -- --warm-up-time 1 --measurement-time 1 --sample-size 10 \
              | tee -a target/bench-output.log
          done
      - name: Upload bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output-${{ matrix.os }}
          path: target/bench-output.log
