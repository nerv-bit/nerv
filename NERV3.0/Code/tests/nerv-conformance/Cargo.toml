[package]
name = "nerv-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Conformance registry: canonical encoding, spec validation and hashing, frozen golden vectors, reference emission schedule"

[lints]
workspace = true

[lib]
name = "nerv_conformance"
path = "src/lib.rs"

# The conformance crate ships as a library only; the dedicated
# `src/bin/conformance.rs` file was an early prototype generator (no
# main()), fully duplicated under `pub mod vectors;`. Stale binary
# entrypoint removed; the lib's `vectors` module is the canonical
# generator surface.

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
nerv-core = { path = "../../crates/nerv-core" }
