[package]
name = "nerv-wallet"
description = "NERV client-side everything (WP App A): keys, construction, proving, scanning, submission, completion, claiming, rehoming, witness management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nerv_wallet"
path = "src/lib.rs"

[dependencies]
nerv-core = { path = "../nerv-core" }
nerv-crypto = { path = "../nerv-crypto" }
nerv-custody = { path = "../nerv-custody" }
nerv-codec = { path = "../nerv-codec" }
nerv-seal = { path = "../nerv-seal" }
nerv-proofs = { path = "../nerv-proofs" }
nerv-net = { path = "../nerv-net" }
nerv-witness = { path = "../nerv-witness" }
nerv-economy = { path = "../nerv-economy" }
nerv-state = { path = "../nerv-state" }
nerv-registry = { path = "../nerv-registry" }
thiserror = { workspace = true }
getrandom = { workspace = true }

[features]
# Pulls in the executor's test scaffolding (`nerv_state::testkit`). Used
# by the `smoke_cross_crate` example to drive `apply_block` from outside
# the crate. Run the example with:
#
#   cargo run -p nerv-wallet --example smoke_cross_crate --features testkit --release
#
# This is intentionally an opt-in feature so production builds (without
# `--features testkit`) stay slim.
testkit = ["nerv-state/testkit"]

[dev-dependencies]
nerv-wallet-core = { path = "../nerv-wallet-core" }
blake3 = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
