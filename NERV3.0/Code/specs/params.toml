# ============================================================================
# NERV v3.0-corrigenda — Machine-Readable Protocol Parameters
# ============================================================================
# THE single source of truth (WP App B, as amended by §12.2 and Appendix D /
# D.6). Parsed, validated, and hashed by tests/nerv-conformance; codegen'd
# into nerv-core::params by chunk 2's build.rs.
#
# Discipline (P3, P5, P9, D.2, D.5):
#   * Every value carries provenance: a WP section, or "genesis-config" for
#     values the whitepaper deliberately leaves to genesis configuration.
#   * Integers, booleans, strings only. Floats are forbidden (P5) and
#     rejected by the loader — including anywhere inside this file.
#   * Cross-field invariants are enforced by nerv-conformance::spec.
#   * The BLAKE3 spec-hash of the validated tree is pinned by the frozen
#     conformance manifest; any parameter change is a visible re-freeze.
#   * Where the whitepaper is internally inconsistent, [errata] records the
#     issue and the resolution; the resolved value is what ships here.
#
# Units: economy amounts are WHOLE NERV (TOML integers are i64; nano-NERV
# bucket totals exceed i64 range — code scales by nano_per_nerv in u128).
# Small fee values are nano-NERV. Durations use the 30-day month / 360-day
# year convention (determinism; standard vesting practice).
# ============================================================================

[meta]
spec_name = "NERV"
spec_version = "3.0-corrigenda"          # WP v3.0 + Appendix D; folds into v3.1
hash_algorithm = "blake3"                # validated: the loader hashes with blake3
spec_hash_domain = "nerv.spechash.v1"
source_documents = ["whitepaper-v3.0", "appendix-d-corrigenda"]
freeze_milestone = "M1"                  # vectors freeze at M1 (WP §14.1)

[protocol]
supply_nerv = 10000000000                # fixed; zero at genesis, post-launch emission (§12.1, E-008)
nano_per_nerv = 1000000000
shard_count_genesis = 64                 # App B; 6-bit IDs, prefix trie (§8.2)
shard_id_bits_genesis = 6                # validated: 2^6 == shard_count_genesis
shard_count_max = 1024                   # §8 design target

[timing]
beacon_interval_secs = 1                 # App B
shard_block_target_secs = 1              # "1–2 s within the interval" (App B)
shard_block_max_secs = 2
epoch_secs = 86400                       # 24 h; committee rotation & re-key
governance_epoch_days = 7                # genesis-config (WP cadence unpinned; see errata note)

[consensus]
signature_scheme = "ml-dsa-65"           # FIPS 204 / Dilithium3 class (§9.2, App B)
emergency_signature_scheme = "slh-dsa"   # FIPS 205 fallback (§9.4)
sortition = "beacon-seeded-hash-ranking" # E-007 (DSR-5): no lattice VRF exists in production
shard_committee_size = 21                # App B; Byzantine tolerance is DERIVED: 6 (E-009)
shard_quorum = 15                        # 2f+1-style QC; ML-DSA-65 signatures
beacon_committee_size = 31               # derived tolerance 10 (consistent with WP §8.3)
beacon_quorum = 21
registry_committee_size = 21             # derived tolerance 6 (E-009)
registry_quorum = 15
attestation_signers = 21                 # E-001: per-interval signer subset of beacon committee
attestation_quorum = 15                  # E-001: "15-of-21" per §11.2; ~50 KB ML-DSA bulk
staggered_thirds = true                  # beacon rotation (§8.3)

[custody]
nct_depth = 32                           # ≈4.3e9 notes/shard (§3.3)
nct_node_hash = "poseidon2"              # E-002: in-circuit economy (§5.3; design doc nct.rs)
nullifier_tree_depth = 256               # §3.4
nullifier_tree_hash = "blake3"           # E-002: sparse Merkle over 256-bit keys
transit_log_hash = "blake3"              # sorted-map settled-leg index (§3.4)
anchor_window_headers = 64               # §4.3 rule 2 (freshness window)
value_min_nano = 1                       # 0 < v (§3.2)
value_max_nano = 1152921504606846976     # 2^60 nano-NERV (§3.2)
note_nonce_bits = 256                    # ρ
blinding_bits = 256                      # r
memo_max_bytes = 80                      # §3.2
note_kem = "ml-kem-768"                  # §3.2 hybrid note encryption
note_aead = "chacha20poly1305"
commitment_hash = "blake3"               # cm = BLAKE3("nerv.cm" ‖ v ‖ ρ ‖ d ‖ r)
nullifier_hash = "blake3"                # nf derivation

# D.3 expiry windows: an issuing leg must declare expiry ∈ [T_min, T_max] blocks
# after the including block; a Pending transit entry is revert-deterministic at
# expiry + L_grace. (Concrete values chosen to match the 24 h epoch / 6 s block.)
d3_expiry_min_blocks_t_min = 100         # ≈10 min: short enough to bound griefing
d3_expiry_max_blocks_t_max = 14400       # ≈24 h: one epoch
d3_expiry_grace_blocks_l_grace = 200     # ≈20 min: post-expiry grace before revert
# Per-tx structural caps (mirrors leg-input / leg-output caps below for sanity).
max_inputs_per_leg = 64
max_outputs_per_leg = 64
max_legs_per_tx = 16
max_burns_per_leg = 8
ct_max_bytes = 2048                      # KEM ciphertext (1088 B) + AEAD overhead headroom

[proofs]
system = "air-stark"                     # §5.3
field = "goldilocks"                     # 64-bit Goldilocks-class prover field
field_modulus = "18446744069414584321"   # 2^64 − 2^32 + 1 (validated; quoted as string because the value exceeds i64::MAX and the toml crate's default deserializer uses i64)
fri_security_bits = 100                  # D.2 FRI floor; QROM stated
fiat_shamir_hash = "blake3"
fiat_shamir_model = "qrom"               # the protocol's single named non-standard assumption
lookup_blake3_window_bits = 16           # D.2 lookup mandate
range_window_bits = 60                   # windowed 60-bit range checks
digit_decomposition_bits = 8            # seal digit decomposition
fs_binding_challenge = "nf-txid-shell"   # H(all nullifiers ‖ txid ‖ shell digest) (§5.1 st. 11)
[proofs.fri]                             # chunk 12.5: the native engine's frozen FRI config (D.2)
log_blowup = 4                           # rate 2^-4; conjectured FRI term b·q/2 = 112 bits
num_queries = 56                         # 112 sits above the envelope's tightest field term (~111)
log_final_poly_len = 1                   # final layer of 2 points; coefficient cap floors at 1
commit_pow_bits = 0                      # grinding in reserve (D.2; the engine implements it)
query_pow_bits = 0                       # Envelope check at these values (the gate runs per proof at the actual log_n): α = 128 − ceil_log₂(families) ≥ 108 (seal-chip scale 2^20); DEEP-ALI = 128 − ceil_log₂(max_heavy·N) ≥ 100 for max_heavy ≤ 5, N ≤ 2^25; batch ≥ 115 at W ≤ 2^16; FRI = 112. Floor 100 met with ≥ 7 bits margin across the whole D.2 envelope; traces beyond 2^25 re-gate (the gate errors loudly, never silently proves weak).

poseidon2_t = 16                    # §5.3: state width over the prover field
poseidon2_full_rounds = 8           # external rounds (M_E), split 4 + 4
poseidon2_partial_rounds = 56       # internal rounds (M_I); frozen at ≥ plonky3-class margin
poseidon2_sbox_degree = 7           # x^7; bijective on Goldilocks: gcd(7, p−1) = 1 (CI-verified)


[overlay]
w_rows = 64                              # δ ∈ (Z/2^64)^64 (§7.2)
w_cols = 256                             # feature count (slots + rails)
w_bits = 16                              # 1.15 signed fixed-point
w_frac_bits = 15
embedding_dims = 64                      # 512 B per shard
embedding_bits_per_dim = 64
slot_count = 224                         # account slots, indices 0–223 (§7.2)
max_active_slots = 6                     # admissibility bound (§7.4)
spark_bound = 13                         # any 13 of 224 slot columns independent (§7.4)
volume_rail_index = 224
fee_rail_index = 225
count_rail_index = 226
log_rail_index = 227
type_time_rail_start = 228               # through 255
forecaster_ar_window = 1024              # §10.2
challenger_window_blocks = 2016          # ~2 weeks (§10.4)
challenger_min_coverage_permille = 900   # ≥ 90% commit coverage (§10.4)

[seal]
ring_degree = 256                        # R_q = Z_q[x]/(x^256+1) (§6.3.1)
q = 4293918721                           # 0xFFF00001 = 4095·2^20 + 1; Proth prime, 512 | q−1 (E-57)
q_bits = 32
module_rank = 8                          # A ∈ R_q^{8×8}; s ∈ R_q^8 (§6.3.1)
plaintext_rings = 2                      # T ∈ R_q^{2×8}; m ∈ R_q^2
digit_slots = 512                        # 2 × 256
digits_used = 512                        # erratum 40: 8 positions × 8 bits = 64 exactly
digit_bits = 8                           # erratum 40 (supersedes §6.3.8's 10-bit)
digits_per_coordinate = 8                # position 7 is a full digit — no guard plane
scale_log2 = 15                          # erratum 40: honest margin 9.49σ at B_min = 128
noise_eta = 2                            # encryptor-side CBD (§6.3.8)
noise_in_circuit_bound = 3               # statement-10 3σ bound (§6.3.7)
noise_budget_bits = 16                   # informative; the exact budget is nerv-seal::noise (E-31)
dkg_noise_eta = 1                        # erratum 41: ternary committee key material
committee_n = 10                         # E-003
threshold_t = 7                          # §6.3.3, App B
chunk_min = 128                          # B_min privacy floor (§6.4)
chunk_max = 128                          # erratum 40: the closable point at 32-bit q (larger splits)
sigma_challenge_weight = 32              # FS-with-aborts engine (§6.3.3/§6.3.5; erratum 45)
sigma_uniform_log2 = 22
sigma_attempt_cap = 1024
security_classical_bits = 128            # advisory tier (§6.3.8); M1 estimator freeze
security_quantum_bits = 96
pss = true                               # D.1 (erratum 50: fresh-DKG semantics)
pss_handoff_intervals = 2                # D.1/D.6
committee_padding = true                 # §6.3.6 (erratum 52)





[mixnet]
