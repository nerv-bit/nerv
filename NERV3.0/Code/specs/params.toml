[[errata]]
id = "E-001"
refs = "§11.2 vs §8.3"
issue = "Interval attestation '15-of-21 ML-DSA-65' vs beacon committee of 31 with tolerance 10."
resolution = "Attestation signer set is a per-interval 21-member subset of the beacon committee, quorum 15 (BFT-safe as a nested committee, f=6; ~50 KB = 15 ML-DSA-65 signatures). The f=10 promise applies to beacon consensus, not the attestation signature policy; flagged for M0 third-party spec review."

[[errata]]
id = "E-002"
refs = "§5.3 vs §3.3/§3.4/App B"
issue = "§5.3 states Poseidon2 for all tree-internal node hashing; §3.3/§3.4 and App B state BLAKE3 for the NCT and the nullifier tree."
resolution = "NCT internal nodes: Poseidon2 (in-circuit economy, Merkle chip is Poseidon2). Nullifier tree: BLAKE3 sparse Merkle depth 256. Transit log: BLAKE3 sorted map. Per the implementation design document (nct.rs, nullifier.rs, transit.rs)."

[[errata]]
id = "E-003"
refs = "§6.3.3/App B vs §8.3"
issue = "Decryption committee 't=7 of n=10' vs §8.3's 21-member shard committee 'also serving' as the decryption committee with threshold t=7."
resolution = "Decryption committee is a 10-member per-epoch subset of the 21-member shard committee; threshold t=7. Both texts agree on t=7."

[[errata]]
id = "E-004"
refs = "§6.2/App B"
issue = "Exponential jitter stated with μ=100 ms and σ=200 ms; an exponential distribution has σ=μ."
resolution = "Truncated exponential with mean 100 ms and hard cap 500 ms (realized σ slightly below 100 ms). The σ=200 figure is carried over from v2.1 and is not realizable."

[[errata]]
id = "E-005"
refs = "§8.5 vs §8.8"
issue = "S_hi described as 'half of the shard's engineered sustained ceiling' with S_hi=4,000/s, but the ceiling is 10,000 legs/s."
resolution = "S_hi = 4,000/s and engineered ceiling = 10,000/s are both pinned; 'half' is a mislabel (40%)."

[[errata]]
id = "E-006"
refs = "App B vs §12.2"
issue = "App B allocation row '20/30/25/12/10/3' predates the founder reallocation (§12.2: 20/6/30/22/10/9/3)."
resolution = "§12.2 governs (its own consistency-amendment list says so): seven buckets summing to 100%."

[[errata]]
id = "E-007"
refs = "§8.3 vs DSR-5"
issue = "'VRF-sampled sortition' — no production lattice-VRF exists; protocol requirements are unpredictability-before-finality, public verifiability, determinism."
resolution = "Beacon-seeded hash sortition: membership = canonical ranking of H(epoch randomness ‖ pubkey ‖ epoch) over the finalized attestation hash chain. Recorded as a specification erratum so document and code never diverge."

[[errata]]
id = "E-008"
refs = "§3.8 vs §12.1/§12.2"
issue = "§3.8 creates the entire supply as genesis notes; §12.1 commits zero spendable supply at block 0 (no pre-mine)."
resolution = "§12 supersedes §3.8 (per §12.2's own amendment register): genesis commits empty trees and an empty emission ledger; the claim rail of §12.3 replaces the governance-gated mint window; burns unchanged."

[[errata]]
id = "E-009"
refs = "§8.3/App B"
issue = "Shard/registry committees stated as '21 members, tolerance 7, quorum 15' — n=21 with q=15 cannot sustain f=7 (liveness requires n−f ≥ q ⇒ 14 ≥ 15, false)."
resolution = "Operative parameters are size 21 and quorum 15 (both texts agree on these). Derived Byzantine tolerance is min(2q−n−1, n−q) = 6, not 7. The beacon committee (31/21) is internally consistent with tolerance 10. Derived tolerances are computed and reported by the spec validator; never hand-copied."

