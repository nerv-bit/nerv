[workspace]


[package]
name = "nerv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"


[package.metadata]
cargo-fuzz = true


[dependencies]
libfuzzer-sys = "0.13"
nerv-core = { path = "../crates/nerv-core" }
nerv-crypto = { path = "../crates/nerv-crypto" }
nerv-seal = { path = "../crates/nerv-seal" }
