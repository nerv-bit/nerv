[package]
name = "nerv-gui"
description = "NERV wallet GUI — one Rust codebase compiling to desktop (native), web (WASM/PWA), and mobile (iOS/Android)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nerv_gui"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "nerv-gui"
path = "src/main.rs"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
nerv-wallet-core = { path = "../../crates/nerv-wallet-core" }
nerv-core = { path = "../../crates/nerv-core" }

# Native-only (the full wallet with proving):
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nerv-wallet = { path = "../../crates/nerv-wallet" }
nerv-crypto = { path = "../../crates/nerv-crypto" }
nerv-custody = { path = "../../crates/nerv-custody" }
nerv-economy = { path = "../../crates/nerv-economy" }

# WASM-only (the web wallet; proving is delegated to a connected node):
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Navigator",
    "Window",
] }
log = "0.4"

[features]
default = []

[lints]
workspace = true

