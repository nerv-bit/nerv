# NERV Wallet PWA — nginx configuration.
# The WASM bundle with correct MIME types, caching, and security headers.

server {
    listen 80;
    server_name wallet.nerv.example.com;

    # Redirect to HTTPS (in production).
    # return 301 https://$host$request_uri;

    root /var/www/nerv-wallet;
    index index.html;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; img-src 'self' data:; worker-src 'self' blob:;" always;

    # The WASM bundle: correct MIME types, long cache (content-hashed).
    location /pkg/ {
        types {
            application/wasm wasm;
            application/javascript js;
            text/plain js.map;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker: no-cache (must always be fresh).
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # The manifest: no-cache.
    location /manifest.json {
        add_header Cache-Control "no-cache";
        types {
            application/manifest+json json;
        }
    }

    # The HTML: no-cache (always the latest shell).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Compression.
    gzip on;
    gzip_types application/wasm application/javascript application/json text/html text/css;
    gzip_min_length 1024;

    # Large body allowance (the wallet sends transactions through the node's RPC).
    client_max_body_size 10m;
}

